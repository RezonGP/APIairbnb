version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: airbnb_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-airbnb}
      MYSQL_USER: ${MYSQL_USER:-airbnb_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_airbnb_data:/var/lib/mysql

volumes:
  mysql_airbnb_data:
